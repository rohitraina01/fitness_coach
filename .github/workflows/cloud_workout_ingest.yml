name: Cloud Workout Ingestion (Autonomous Coach)

on:
  repository_dispatch:
    types: [log_workout]
  workflow_dispatch:
    inputs:
      date:
        description: 'Workout Date (YYYY-MM-DD)'
        required: true
        default: '2026-10-11'
      session_type:
        description: 'Session Type (Pull / Legs / Push)'
        required: true
        default: 'Pull'
      duration:
        description: 'Duration (minutes)'
        required: false
        default: '60'
      notes:
        description: 'Workout Log Raw Text'
        required: true
        default: 'Lat pulldown 50kg x 10, 10, 8'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "workout-ingest"
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Workout Ingestion
        run: |
          DATE="${{ github.event.client_payload.date || github.event.inputs.date }}"
          TYPE="${{ github.event.client_payload.session_type || github.event.inputs.session_type }}"
          DUR="${{ github.event.client_payload.duration || github.event.inputs.duration || '60' }}"
          NOTES="${{ github.event.client_payload.raw_text || github.event.inputs.notes }}"

          echo "Ingesting workout for Date: $DATE, Type: $TYPE"
          python scripts/ingest_workout.py --date "$DATE" --type "$TYPE" --duration "$DUR" --notes "$NOTES"

      - name: Sync Web Directory to Docs
        run: |
          cp -r bridge/web/* docs/

      - name: Commit and Push Records to Repository
        run: |
          git config user.name "Apex Coach Bot"
          git config user.email "coach-bot@users.noreply.github.com"
          git add DATA/ WORKOUT_LOGS/ DASHBOARD/ OUTPUTS/ docs/ CURRENT_STATUS.md CURRENT_NEXT_WORKOUT.md
          if git diff-index --quiet HEAD --; then
            echo "No changes detected."
          else
            git commit -m "Cloud automated ingestion: ${{ github.event.client_payload.date || github.event.inputs.date }} ${{ github.event.client_payload.session_type || github.event.inputs.session_type }}"
            git push origin master || git push origin main
          fi
